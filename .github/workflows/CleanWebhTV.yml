name: Clean Up WebHTV Beta Releases
on:
  workflow_dispatch:      # 允许随时在 Actions 页面手动触发执行
  schedule:
    - cron: '0 2 * * *'   # 每天凌晨 02:00 自动巡检并清理遗留的 beta 版（以防漏网之鱼）

jobs:
  cleanup_beta_releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 必须具备写入权限才能删除 Release 和 Tag
    steps:
      - name: Scan and Delete Beta Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          echo "🔍 正在扫描 $TARGET_REPO 中所有 WebHTV 的 Beta 测试版..."
          
          # 使用 --paginate 获取全量列表，利用 jq 筛选以 WH- 开头且包含 beta (忽略大小写) 的标签
          gh api repos/$TARGET_REPO/releases --paginate | jq -c '[.[] | select((.tag_name | startswith("WH-")) and (.tag_name | ascii_downcase | contains("beta")))] | .[]' | while read -r rel_node; do
            [ -z "$rel_node" ] && continue
            
            tag_name=$(echo "$rel_node" | jq -r '.tag_name')
            
            echo "🗑️ 发现测试版: $tag_name，正在彻底删除..."
            # -y 表示跳过确认，--cleanup-tag 表示连同 Git Tag 一并物理删除
            gh release delete "$tag_name" -y --cleanup-tag -R "$TARGET_REPO"
            
            # 停顿 2 秒，防止高频删除触发 GitHub API 的防滥用限流
            sleep 2 
          done
          
          echo "✅ 所有 WebHTV Beta 版本清理完毕！"
