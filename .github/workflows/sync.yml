name: N8G8 - Dual Engine Sync (FongMi & WebHTV)
on:
  schedule:
    - cron: '0 21 * * *' # 北京时间每天凌晨 5 点 (UTC 21:00)
  workflow_dispatch:      # 允许随时在 Actions 页面手动触发

jobs:
  # -------------------------------------------------------------------
  # 任务 1：FongMi 影视同步（从 FongMi/Release 的 Releases 页面获取最新正式版）
  # -------------------------------------------------------------------
  fongmi_sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Instant Sync FongMi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: "sowahsun/N8G8"
          PREFIX: "FongMi-v"
        run: |
          echo "🔍 正在从 FongMi/Release 的 Releases 页面获取最新正式版..."

          latest_rel=$(gh api repos/FongMi/Release/releases | jq -c '[.[] | select(.prerelease == false) | select((.tag_name | ascii_downcase | contains("dev")) | not) | select((.tag_name | ascii_downcase | contains("kitkat")) | not)] | .[0]')

          if [ -z "$latest_rel" ] || [ "$latest_rel" == "null" ]; then
            echo "❌ 未找到可用的正式版 Release，跳过同步。"
            exit 0
          fi

          raw_tag=$(echo "$latest_rel" | jq -r '.tag_name')
          my_tag="${PREFIX}${raw_tag}"

          if gh release view "$my_tag" -R "$TARGET_REPO" >/dev/null 2>&1; then
            echo "✅ FongMi 版本 $my_tag 已存在，跳过。"
            exit 0
          fi

          echo "🚀 发现 FongMi 新版本: $raw_tag"
          title=$(echo "$latest_rel" | jq -r '.name // "FongMi Release"')
          echo "$latest_rel" | jq -r '.body // "FongMi 自动同步更新"' > fongmi_notes.txt

          gh release create "$my_tag" -R "$TARGET_REPO" --title "FongMi 影视: $title" --notes-file fongmi_notes.txt

          apk_urls=$(echo "$latest_rel" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')
          if [ -z "$apk_urls" ]; then
            echo "⚠️ 该 Release 中没有找到 APK 文件。"
          else
            for url in $apk_urls; do
              orig_name=$(basename "$url")
              echo "⬇️ 正在下载 $orig_name..."
              curl -sL -o "$orig_name" "$url"
              echo "⬆️ 正在上传 $orig_name..."
              gh release upload "$my_tag" "$orig_name" --clobber -R "$TARGET_REPO"
              rm -f "$orig_name"
            done
          fi

  # -------------------------------------------------------------------
  # 任务 2：WebHTV 默影视同步
  # -------------------------------------------------------------------
  webhtv_sync:
    needs: fongmi_sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync WebHTV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: "sowahsun/N8G8"
        run: |
          echo "🔍 正在获取 fish2018/webhtv 的最新正式版本 (自动跳过 Beta 版)..."

          gh api repos/fish2018/webhtv/releases | jq -c '[.[] | select(.prerelease == false and ((.tag_name | ascii_downcase | contains("beta")) | not))] | .[0:8] | .[]' | while read -r rel_node; do
            [ -z "$rel_node" ] && continue
            raw_tag=$(echo "$rel_node" | jq -r '.tag_name')
            my_tag="WH-${raw_tag}"

            apk_count=$(gh release view "$my_tag" -R "$TARGET_REPO" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))] | length' 2>/dev/null || echo "0")
            if gh release view "$my_tag" -R "$TARGET_REPO" >/dev/null 2>&1 && [ "$apk_count" -eq "0" ]; then
              echo "🗑️ 检测到空壳 Release: $my_tag，正在删除重置..."
              gh release delete "$my_tag" -y --cleanup-tag -R "$TARGET_REPO"
              sleep 2
            fi

            if ! gh release view "$my_tag" -R "$TARGET_REPO" >/dev/null 2>&1; then
              echo "🚀 发现 WebHTV 新版正式发布并上传: $my_tag"
              gh release create "$my_tag" -R "$TARGET_REPO" --title "WebHTV: $raw_tag" --notes "Auto-synced stable release from fish2018/webhtv"
              assets_urls=$(echo "$rel_node" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')
              for url in $assets_urls; do
                fname=$(basename "$url")
                curl -L -o "$fname" "$url"
                gh release upload "$my_tag" "$fname" --clobber -R "$TARGET_REPO"
                rm -f "$fname"
              done
            else
              echo "✅ WebHTV 正式版本 $my_tag 已存在且完整，跳过。"
            fi
          done

  # -------------------------------------------------------------------
  # 任务 3：提取 Release 生成 list.json
  # -------------------------------------------------------------------
  generate_release_index:
    needs: webhtv_sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 提取 Release 并生成 list.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          echo "🟠 正在扫描 N8G8 仓库的所有 Release 资产..."

          gh api repos/${{ github.repository }}/releases --paginate | jq '
            [.[] | {tag: .tag_name, assets: .assets}] | map(select(.assets | length > 0))
            | [.[] | .tag as $tag | .assets[] | select(.name | endswith(".apk")) | {
                name: ("[" + $tag + "] " + .name),
                type: "release_asset",
                path: ("Releases/" + $tag + "/" + .name),
                time: .updated_at,
                url: .browser_download_url
              }]
          ' > list.json

          git add list.json
          git commit -m "System: Auto-generate pretty list.json from Releases" || exit 0
          git push origin main
