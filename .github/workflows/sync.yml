name: N8G8 - Dual Engine Sync (FM Pro & FongMi & WebHTV)
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------
  # 任务 1：FongMi 影视同步（保留原样，不动）
  # -------------------------------------------------------------------
  fongmi_sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Instant Sync FongMi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: "sowahsun/N8G8"
          PREFIX: "FongMi-v"
        run: |
          echo "🔍 正在读取 FongMi 目录文件..."
          contents=$(gh api repos/FongMi/Release/contents/apk?ref=fongmi)

          json_url=$(echo "$contents" | jq -r '.[] | select(.name=="leanback.json") | .download_url')

          if [ -z "$json_url" ] || [ "$json_url" == "null" ]; then
            echo "❌ 找不到 leanback.json，无法获取版本号。"
            exit 0
          fi

          echo "📄 正在解析 leanback.json..."
          json_data=$(curl -sL "$json_url")
          version=$(echo "$json_data" | jq -r '.name')

          if [ -z "$version" ] || [ "$version" == "null" ]; then
            echo "❌ 无法解析版本号，跳过同步。"
            exit 0
          fi

          my_tag="${PREFIX}${version}"

          if gh release view "$my_tag" -R "$TARGET_REPO" >/dev/null 2>&1; then
            echo "✅ FongMi 版本 $my_tag 已存在，跳过。"
            exit 0
          fi

          echo "🚀 发现 FongMi 新版本: $version"
          echo "$json_data" | jq -r '.desc // "FongMi 自动同步更新"' > fongmi_notes.txt

          gh release create "$my_tag" -R "$TARGET_REPO" --title "FongMi 影视: $version" --notes-file fongmi_notes.txt

          apk_urls=$(echo "$contents" | jq -r '.[] | select(.name | endswith(".apk")) | .download_url')
          for url in $apk_urls; do
            orig_name=$(basename "$url")
            echo "⬇️ 正在下载 $orig_name..."
            curl -sL -o "$orig_name" "$url"
            echo "⬆️ 正在上传 $orig_name..."
            gh release upload "$my_tag" "$orig_name" --clobber -R "$TARGET_REPO"
            rm -f "$orig_name"
          done

  # -------------------------------------------------------------------
  # 任务 2：FMApp 从 FongMi/Release 增量同步（新增，替代原有的 pro/base 两个任务）
  #         tag 为纯版本号格式（如 5.6.3），同步后前缀 FM-
  #         只增不减，已存在的 Release 一律跳过
  # -------------------------------------------------------------------
  fmapp_fongmi_release_sync:
    needs: fongmi_sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync FMApp from FongMi/Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: "sowahsun/N8G8"
          SOURCE_REPO: "FongMi/Release"
          PREFIX: "FM-"
        run: |
          echo "🔍 正在从 $SOURCE_REPO 全量拉取 release..."
          gh api repos/$SOURCE_REPO/releases --paginate | jq -c '.[]' | while read -r rel_node; do
            [ -z "$rel_node" ] && continue
            raw_tag=$(echo "$rel_node" | jq -r '.tag_name')
            my_tag="${PREFIX}${raw_tag}"

            # 本地已存在就跳过，不覆盖、不删除（只增不减）
            if gh release view "$my_tag" -R "$TARGET_REPO" >/dev/null 2>&1; then
              echo "✅ 已存在，跳过: $my_tag"
              continue
            fi

            echo "🚀 新增: $my_tag"
            title=$(echo "$rel_node" | jq -r '.name // "FM Release"')
            echo "$rel_node" | jq -r '.body // "Auto-synced from FongMi/Release"' > release_notes.txt

            gh release create "$my_tag" -R "$TARGET_REPO" --title "FMApp: $title" --notes-file release_notes.txt

            assets=$(echo "$rel_node" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')
            for url in $assets; do
              orig_name=$(basename "$url")
              curl -L -o "$orig_name" "$url"
              gh release upload "$my_tag" "$orig_name" --clobber -R "$TARGET_REPO"
              rm -f "$orig_name"
            done
          done

  # -------------------------------------------------------------------
  # 任务 3：WebHTV 默影视同步（保留原样，仅改依赖）
  # -------------------------------------------------------------------
  webhtv_sync:
    needs: fmapp_fongmi_release_sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync WebHTV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: "sowahsun/N8G8"
        run: |
          echo "🔍 正在获取 fish2018/webhtv 的最新正式版本 (自动跳过 Beta 版)..."

          gh api repos/fish2018/webhtv/releases | jq -c '[.[] | select(.prerelease == false and ((.tag_name | ascii_downcase | contains("beta")) | not))] | .[0:8] | .[]' | while read -r rel_node; do
            [ -z "$rel_node" ] && continue
            raw_tag=$(echo "$rel_node" | jq -r '.tag_name')
            my_tag="WH-${raw_tag}"

            apk_count=$(gh release view "$my_tag" -R "$TARGET_REPO" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))] | length' 2>/dev/null || echo "0")
            if gh release view "$my_tag" -R "$TARGET_REPO" >/dev/null 2>&1 && [ "$apk_count" -eq "0" ]; then
              echo "🗑️ 检测到空壳 Release: $my_tag，正在删除重置..."
              gh release delete "$my_tag" -y --cleanup-tag -R "$TARGET_REPO"
              sleep 2
            fi

            if ! gh release view "$my_tag" -R "$TARGET_REPO" >/dev/null 2>&1; then
              echo "🚀 发现 WebHTV 新版正式发布并上传: $my_tag"
              gh release create "$my_tag" -R "$TARGET_REPO" --title "WebHTV: $raw_tag" --notes "Auto-synced stable release from fish2018/webhtv"
              assets_urls=$(echo "$rel_node" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')
              for url in $assets_urls; do
                fname=$(basename "$url")
                curl -L -o "$fname" "$url"
                gh release upload "$my_tag" "$fname" --clobber -R "$TARGET_REPO"
                rm -f "$fname"
              done
            else
              echo "✅ WebHTV 正式版本 $my_tag 已存在且完整，跳过。"
            fi
          done

  # -------------------------------------------------------------------
  # 任务 4：提取 Release 生成 list.json（保留原样，仅加 --paginate 以拉取全量）
  # -------------------------------------------------------------------
  generate_release_index:
    needs: webhtv_sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 提取 Release 并生成 list.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          echo "🟠 正在扫描 N8G8 仓库的所有 Release 资产..."

          # --paginate 确保拉取所有 Release（超过 30 个也不会漏）
          gh api repos/${{ github.repository }}/releases --paginate | jq '
            [.[] | {tag: .tag_name, assets: .assets}] | map(select(.assets | length > 0))
            | [.[] | .tag as $tag | .assets[] | select(.name | endswith(".apk")) | {
                name: ("[" + $tag + "] " + .name),
                type: "release_asset",
                path: ("Releases/" + $tag + "/" + .name),
                time: .updated_at,
                url: .browser_download_url
              }]
          ' > list.json

          git add list.json
          git commit -m "System: Auto-generate pretty list.json from Releases" || exit 0
          git push origin main
